<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sudoku Solver</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --surface: #181c27;
    --surface2: #1e2436;
    --border: #2a3050;
    --border-strong: #3b4572;
    --accent: #6c8ef5;
    --accent2: #a78bfa;
    --accent3: #34d399;
    --warn: #f59e42;
    --danger: #f87171;
    --text: #e8eaf6;
    --text-muted: #7986b0;
    --text-dim: #4a5480;
    --given: #c7d2fe;
    --cell-bg: #181c27;
    --cell-hover: #222840;
    --cell-active: #1a2040;
    --box-border: #5c6bc0;
    --hint-text: #4a5480;
    --shadow: 0 8px 32px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 12px 48px;
    background-image: radial-gradient(ellipse at 20% 10%, rgba(108,142,245,0.07) 0%, transparent 60%),
                      radial-gradient(ellipse at 80% 80%, rgba(167,139,250,0.06) 0%, transparent 60%);
  }

  header {
    text-align: center;
    margin-bottom: 28px;
    animation: fadeDown 0.6s ease both;
  }
  header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(2rem, 5vw, 3rem);
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.02em;
  }
  header p {
    color: var(--text-muted);
    font-size: 0.95rem;
    margin-top: 6px;
    font-weight: 300;
  }

  .main-layout {
    display: flex;
    gap: 28px;
    align-items: flex-start;
    justify-content: center;
    flex-wrap: wrap;
    width: 100%;
    max-width: 960px;
  }

  /* ── GRID ── */
  .grid-wrap {
    animation: fadeUp 0.5s ease 0.1s both;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  #grid {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 0;
    border: 2.5px solid var(--box-border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: var(--shadow), 0 0 0 1px rgba(92,107,192,0.2);
    background: var(--border);
    width: min(486px, 95vw);
    height: min(486px, 95vw);
    position: relative;
  }

  .cell {
    background: var(--cell-bg);
    border: 1px solid var(--border);
    position: relative;
    cursor: pointer;
    transition: background 0.12s, box-shadow 0.12s;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Box borders (3x3) */
  .cell[data-col="2"], .cell[data-col="5"] { border-right: 2px solid var(--box-border); }
  .cell[data-col="3"], .cell[data-col="6"] { border-left: 2px solid var(--box-border); }
  .cell[data-row="2"], .cell[data-row="5"] { border-bottom: 2px solid var(--box-border); }
  .cell[data-row="3"], .cell[data-row="6"] { border-top: 2px solid var(--box-border); }

  .cell:hover { background: var(--cell-hover); }
  .cell.selected { background: var(--cell-active) !important; box-shadow: inset 0 0 0 2px var(--accent); }
  .cell.same-num { background: rgba(108,142,245,0.08); }
  .cell.related { background: rgba(108,142,245,0.04); }

  .cell-input {
    width: 100%; height: 100%;
    background: transparent;
    border: none;
    outline: none;
    text-align: center;
    font-family: 'DM Mono', monospace;
    font-size: clamp(1rem, 3.5vw, 1.55rem);
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    caret-color: transparent;
    position: absolute;
    inset: 0;
    z-index: 2;
  }
  .cell-input.given { color: var(--given); font-weight: 500; }
  .cell-input.solved { color: var(--accent3); animation: popIn 0.25s ease; }
  .cell-input.conflict { color: var(--danger) !important; }

  /* Candidates */
  .candidates {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    padding: 2px;
    z-index: 1;
    pointer-events: none;
  }
  .candidate {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Mono', monospace;
    font-size: clamp(0.3rem, 1.1vw, 0.55rem);
    color: var(--hint-text);
    line-height: 1;
    transition: color 0.2s;
  }
  .candidate.active { color: var(--text-muted); }

  /* ── SIDE PANEL ── */
  .side-panel {
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-width: 220px;
    max-width: 260px;
    animation: fadeUp 0.5s ease 0.2s both;
  }

  .panel-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.25);
  }
  .panel-card h3 {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-dim);
    margin-bottom: 14px;
    font-weight: 500;
  }

  /* Numpad */
  .numpad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
  }
  .num-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 1.05rem;
    font-weight: 500;
    padding: 10px 0;
    cursor: pointer;
    transition: all 0.12s;
    position: relative;
    overflow: hidden;
  }
  .num-btn:hover { background: var(--border); border-color: var(--accent); color: var(--accent); }
  .num-btn.erase { grid-column: span 3; font-size: 0.75rem; letter-spacing: 0.05em; font-family: 'Outfit', sans-serif; color: var(--text-muted); }
  .num-btn .count-badge {
    position: absolute;
    top: 3px; right: 4px;
    font-size: 0.55rem;
    color: var(--text-dim);
    font-family: 'Outfit', sans-serif;
  }

  /* Actions */
  .btn {
    width: 100%;
    padding: 11px 16px;
    border-radius: 9px;
    border: none;
    cursor: pointer;
    font-family: 'Outfit', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    transition: all 0.15s;
    letter-spacing: 0.02em;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    box-shadow: 0 4px 16px rgba(108,142,245,0.35);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(108,142,245,0.45); }
  .btn-primary:active { transform: translateY(0); }
  .btn-secondary {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-muted);
  }
  .btn-secondary:hover { border-color: var(--border-strong); color: var(--text); }
  .btn-warn {
    background: transparent;
    border: 1px solid rgba(248,113,113,0.3);
    color: var(--danger);
  }
  .btn-warn:hover { background: rgba(248,113,113,0.08); border-color: var(--danger); }

  /* Upload area */
  .upload-area {
    border: 1.5px dashed var(--border-strong);
    border-radius: 9px;
    padding: 14px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
    color: var(--text-muted);
    font-size: 0.82rem;
    line-height: 1.5;
  }
  .upload-area:hover { border-color: var(--accent); color: var(--accent); background: rgba(108,142,245,0.04); }
  .upload-area .icon { font-size: 1.4rem; margin-bottom: 4px; }
  #file-input { display: none; }

  /* Status bar */
  #status-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 0.82rem;
    color: var(--text-muted);
    line-height: 1.5;
    min-height: 48px;
    transition: all 0.2s;
  }
  #status-bar.success { border-color: rgba(52,211,153,0.4); color: var(--accent3); }
  #status-bar.error { border-color: rgba(248,113,113,0.4); color: var(--danger); }
  #status-bar.info { border-color: rgba(108,142,245,0.4); color: var(--accent); }

  /* Solutions panel */
  #solutions-panel {
    width: 100%;
    max-width: 960px;
    margin-top: 20px;
    animation: fadeUp 0.4s ease both;
  }
  .solutions-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
    font-size: 0.82rem;
    color: var(--text-muted);
  }
  .solutions-header strong {
    font-family: 'DM Serif Display', serif;
    font-size: 1.1rem;
    color: var(--text);
  }
  .solutions-grid {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }

  .mini-grid {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    cursor: pointer;
    transition: all 0.15s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  .mini-grid:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
  .mini-grid-label {
    font-size: 0.68rem;
    color: var(--text-dim);
    text-align: center;
    margin-bottom: 6px;
    font-family: 'DM Mono', monospace;
  }
  .mini-table {
    border-collapse: collapse;
    font-family: 'DM Mono', monospace;
    font-size: 0.52rem;
  }
  .mini-table td {
    width: 14px; height: 14px;
    text-align: center;
    vertical-align: middle;
    border: 0.5px solid var(--border);
    color: var(--text-muted);
  }
  .mini-table td.mg-given { color: var(--given); }
  .mini-table td.mg-solved { color: var(--accent3); }

  /* Loader */
  .loader {
    display: inline-flex;
    gap: 4px;
    align-items: center;
  }
  .loader span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: bounce 0.8s infinite;
  }
  .loader span:nth-child(2) { animation-delay: 0.15s; }
  .loader span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%,80%,100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }
  @keyframes fadeDown { from { opacity:0; transform:translateY(-16px); } to { opacity:1; transform:none; } }
  @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }
  @keyframes popIn { 0% { transform:scale(0.7); opacity:0; } 70% { transform:scale(1.1); } 100% { transform:scale(1); opacity:1; } }

  .toggle-hints {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-size: 0.82rem;
    color: var(--text-muted);
    user-select: none;
  }
  .toggle-hints input { display: none; }
  .toggle-track {
    width: 34px; height: 18px;
    background: var(--border);
    border-radius: 9px;
    position: relative;
    transition: background 0.2s;
  }
  .toggle-hints input:checked ~ .toggle-track { background: var(--accent); }
  .toggle-thumb {
    position: absolute;
    top: 2px; left: 2px;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #fff;
    transition: left 0.2s;
  }
  .toggle-hints input:checked ~ .toggle-track .toggle-thumb { left: 18px; }

  @media (max-width: 640px) {
    .main-layout { flex-direction: column; align-items: center; }
    .side-panel { max-width: 100%; width: min(486px, 95vw); }
  }
</style>
</head>
<body>

<header>
  <h1>Sudoku Solver</h1>
  <p>Enter your puzzle, explore every solution</p>
</header>

<div class="main-layout">
  <!-- Grid -->
  <div class="grid-wrap">
    <div id="grid"></div>

    <div id="status-bar">Click a cell, then type or tap a number to fill the puzzle.</div>
  </div>

  <!-- Side Panel -->
  <div class="side-panel">
    <!-- Numpad -->
    <div class="panel-card">
      <h3>Input</h3>
      <div class="numpad" id="numpad">
        <!-- filled by JS -->
      </div>
    </div>

    <!-- Hints toggle -->
    <div class="panel-card" style="padding:14px 18px;">
      <label class="toggle-hints">
        <input type="checkbox" id="hints-toggle" checked>
        <div class="toggle-track"><div class="toggle-thumb"></div></div>
        Show candidate hints
      </label>
    </div>

    <!-- Actions -->
    <div class="panel-card" style="display:flex;flex-direction:column;gap:8px;">
      <h3>Actions</h3>
      <button class="btn btn-primary" id="btn-solve">Solve Puzzle</button>
      <button class="btn btn-secondary" id="btn-validate">Validate</button>
      <button class="btn btn-secondary" id="btn-clear-solved">Clear Solution</button>
      <button class="btn btn-warn" id="btn-reset">Reset All</button>
    </div>

    <!-- Upload -->
    <div class="panel-card">
      <h3>Import from Excel</h3>
      <div class="upload-area" id="upload-area" onclick="document.getElementById('file-input').click()">
        <div class="icon">📂</div>
        <div>Drop .xlsx / .csv here<br>or <u>click to browse</u></div>
      </div>
      <input type="file" id="file-input" accept=".csv,.xlsx">
      <p style="font-size:0.7rem;color:var(--text-dim);margin-top:8px;text-align:center;">Use a 9×9 grid with 0 or blank for empty cells</p>
    </div>
  </div>
</div>

<!-- Solutions -->
<div id="solutions-panel" style="display:none;"></div>

<!-- SheetJS for xlsx parsing -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ═══════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════ */
const N = 9;
let board = Array.from({length:N}, () => Array(N).fill(0));   // user puzzle
let solvedBoard = null;   // current displayed solution
let givenMask = Array.from({length:N}, () => Array(N).fill(false));
let selectedCell = null;  // {r, c}
let showHints = true;
let solutions = [];

/* ═══════════════════════════════════════════════
   BUILD GRID
═══════════════════════════════════════════════ */
function buildGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.row = r;
      cell.dataset.col = c;

      // Candidates overlay
      const cands = document.createElement('div');
      cands.className = 'candidates';
      cands.id = `cands-${r}-${c}`;
      for (let n = 1; n <= 9; n++) {
        const d = document.createElement('div');
        d.className = 'candidate';
        d.id = `cand-${r}-${c}-${n}`;
        d.textContent = n;
        cands.appendChild(d);
      }

      const inp = document.createElement('input');
      inp.className = 'cell-input';
      inp.id = `cell-${r}-${c}`;
      inp.maxLength = 1;
      inp.inputMode = 'numeric';
      inp.readOnly = true;

      cell.appendChild(cands);
      cell.appendChild(inp);
      cell.addEventListener('click', () => selectCell(r, c));
      grid.appendChild(cell);
    }
  }
}

/* ═══════════════════════════════════════════════
   NUMPAD
═══════════════════════════════════════════════ */
function buildNumpad() {
  const pad = document.getElementById('numpad');
  pad.innerHTML = '';
  for (let n = 1; n <= 9; n++) {
    const btn = document.createElement('button');
    btn.className = 'num-btn';
    btn.dataset.num = n;
    btn.innerHTML = `${n}<span class="count-badge" id="badge-${n}"></span>`;
    btn.addEventListener('click', () => inputNumber(n));
    pad.appendChild(btn);
  }
  const eraseBtn = document.createElement('button');
  eraseBtn.className = 'num-btn erase';
  eraseBtn.textContent = '⌫  Erase';
  eraseBtn.addEventListener('click', () => inputNumber(0));
  pad.appendChild(eraseBtn);
}

function updateBadges() {
  for (let n = 1; n <= 9; n++) {
    const count = board.flat().filter(v => v === n).length;
    const el = document.getElementById(`badge-${n}`);
    el.textContent = count > 0 ? count : '';
  }
}

/* ═══════════════════════════════════════════════
   CELL SELECTION & HIGHLIGHTING
═══════════════════════════════════════════════ */
function selectCell(r, c) {
  selectedCell = {r, c};
  document.querySelectorAll('.cell').forEach(el => {
    el.classList.remove('selected','same-num','related');
  });
  const val = board[r][c];
  for (let i = 0; i < N; i++) {
    for (let j = 0; j < N; j++) {
      const el = document.querySelector(`.cell[data-row="${i}"][data-col="${j}"]`);
      if (i === r && j === c) { el.classList.add('selected'); continue; }
      const boxR = Math.floor(r/3), boxC = Math.floor(c/3);
      const iBoxR = Math.floor(i/3), iBoxC = Math.floor(j/3);
      if (i === r || j === c || (iBoxR === boxR && iBoxC === boxC))
        el.classList.add('related');
      if (val && board[i][j] === val) el.classList.add('same-num');
    }
  }
}

/* ═══════════════════════════════════════════════
   INPUT
═══════════════════════════════════════════════ */
function inputNumber(n) {
  if (!selectedCell) return;
  const {r, c} = selectedCell;
  if (givenMask[r][c]) { setStatus('This cell is locked — it\'s part of the original puzzle.', 'error'); return; }
  board[r][c] = n;
  solvedBoard = null;
  renderBoard();
  updateCandidates();
  validateConflicts();
  updateBadges();
  document.getElementById('solutions-panel').style.display = 'none';
  selectCell(r, c);
}

document.addEventListener('keydown', e => {
  if (!selectedCell) return;
  const {r, c} = selectedCell;
  if (e.key >= '1' && e.key <= '9') { inputNumber(parseInt(e.key)); return; }
  if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') { inputNumber(0); return; }
  const moves = {ArrowUp:[-1,0], ArrowDown:[1,0], ArrowLeft:[0,-1], ArrowRight:[0,1]};
  if (moves[e.key]) {
    const [dr, dc] = moves[e.key];
    const nr = Math.max(0, Math.min(8, r+dr));
    const nc = Math.max(0, Math.min(8, c+dc));
    selectCell(nr, nc);
    e.preventDefault();
  }
});

/* ═══════════════════════════════════════════════
   RENDER
═══════════════════════════════════════════════ */
function renderBoard(src) {
  const data = src || board;
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const inp = document.getElementById(`cell-${r}-${c}`);
      const v = data[r][c];
      inp.value = v || '';
      inp.className = 'cell-input';
      if (givenMask[r][c]) inp.classList.add('given');
      else if (src && v) inp.classList.add('solved');
    }
  }
}

function validateConflicts() {
  // Clear
  for (let r = 0; r < N; r++)
    for (let c = 0; c < N; c++)
      document.getElementById(`cell-${r}-${c}`).classList.remove('conflict');

  let hasConflict = false;
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const v = board[r][c];
      if (!v) continue;
      if (hasConflictAt(r, c)) {
        document.getElementById(`cell-${r}-${c}`).classList.add('conflict');
        hasConflict = true;
      }
    }
  }
  return hasConflict;
}

function hasConflictAt(r, c) {
  const v = board[r][c];
  if (!v) return false;
  for (let i = 0; i < N; i++) {
    if (i !== c && board[r][i] === v) return true;
    if (i !== r && board[i][c] === v) return true;
  }
  const br = Math.floor(r/3)*3, bc = Math.floor(c/3)*3;
  for (let i = br; i < br+3; i++)
    for (let j = bc; j < bc+3; j++)
      if ((i !== r || j !== c) && board[i][j] === v) return true;
  return false;
}

/* ═══════════════════════════════════════════════
   CANDIDATES
═══════════════════════════════════════════════ */
function computeCandidates(b) {
  const cands = Array.from({length:N}, () => Array.from({length:N}, () => new Set()));
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      if (b[r][c]) continue;
      for (let n = 1; n <= 9; n++) {
        if (isValid(b, r, c, n)) cands[r][c].add(n);
      }
    }
  }
  return cands;
}

function updateCandidates() {
  const cands = showHints ? computeCandidates(board) : null;
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const panel = document.getElementById(`cands-${r}-${c}`);
      if (board[r][c] || !showHints) { panel.style.display = 'none'; continue; }
      panel.style.display = 'grid';
      const set = cands[r][c];
      for (let n = 1; n <= 9; n++) {
        const el = document.getElementById(`cand-${r}-${c}-${n}`);
        el.classList.toggle('active', set.has(n));
        el.style.color = set.has(n) ? 'var(--text-muted)' : 'transparent';
      }
    }
  }
}

document.getElementById('hints-toggle').addEventListener('change', e => {
  showHints = e.target.checked;
  updateCandidates();
});

/* ═══════════════════════════════════════════════
   SOLVER (backtracking, up to 10 solutions)
═══════════════════════════════════════════════ */
function isValid(b, r, c, n) {
  for (let i = 0; i < N; i++) {
    if (b[r][i] === n || b[i][c] === n) return false;
  }
  const br = Math.floor(r/3)*3, bc = Math.floor(c/3)*3;
  for (let i = br; i < br+3; i++)
    for (let j = bc; j < bc+3; j++)
      if (b[i][j] === n) return false;
  return true;
}

function solve(b, results, limit=10) {
  if (results.length >= limit) return;
  // Find next empty
  let pos = -1;
  for (let i = 0; i < 81; i++) {
    if (b[Math.floor(i/9)][i%9] === 0) { pos = i; break; }
  }
  if (pos === -1) {
    results.push(b.map(row => [...row]));
    return;
  }
  const r = Math.floor(pos/9), c = pos%9;
  for (let n = 1; n <= 9; n++) {
    if (isValid(b, r, c, n)) {
      b[r][c] = n;
      solve(b, results, limit);
      b[r][c] = 0;
      if (results.length >= limit) return;
    }
  }
}

/* ═══════════════════════════════════════════════
   STATUS
═══════════════════════════════════════════════ */
function setStatus(msg, type='', loader=false) {
  const el = document.getElementById('status-bar');
  el.className = type ? `${type}` : '';
  el.innerHTML = loader ? `<span class="loader"><span></span><span></span><span></span></span> ${msg}` : msg;
}

/* ═══════════════════════════════════════════════
   BUTTONS
═══════════════════════════════════════════════ */
document.getElementById('btn-solve').addEventListener('click', () => {
  if (validateConflicts()) { setStatus('Puzzle has conflicts — please fix them first.', 'error'); return; }
  const given = board.flat().filter(v => v).length;
  if (given < 17) { setStatus(`At least 17 clues needed (you have ${given}).`, 'error'); return; }

  setStatus('Solving…', 'info', true);

  setTimeout(() => {
    const copy = board.map(r => [...r]);
    solutions = [];
    solve(copy, solutions, 10);

    if (!solutions.length) {
      setStatus('No solution found. Check the puzzle for mistakes.', 'error');
      return;
    }

    // Display first solution on main grid
    const merged = solutions[0].map((row, r) => row.map((v, c) => board[r][c] ? board[r][c] : v));
    renderBoard(merged);
    updateCandidates();

    if (solutions.length === 1) {
      setStatus(`✓ Unique solution found!`, 'success');
    } else {
      setStatus(`Found ${solutions.length}${solutions.length===10?'+':''} solutions. Showing first below.`, 'info');
    }

    renderSolutions();
  }, 30);
});

document.getElementById('btn-validate').addEventListener('click', () => {
  const conflict = validateConflicts();
  if (conflict) { setStatus('Conflicts detected — highlighted in red.', 'error'); return; }
  const empty = board.flat().filter(v => !v).length;
  if (empty === 0) setStatus('✓ Puzzle is complete and valid!', 'success');
  else setStatus(`No conflicts found. ${empty} cell${empty>1?'s':''} remaining.`, 'info');
});

document.getElementById('btn-clear-solved').addEventListener('click', () => {
  for (let r = 0; r < N; r++)
    for (let c = 0; c < N; c++)
      if (!givenMask[r][c]) board[r][c] = 0;
  solvedBoard = null;
  solutions = [];
  renderBoard();
  updateCandidates();
  validateConflicts();
  updateBadges();
  document.getElementById('solutions-panel').style.display = 'none';
  setStatus('Solution cleared. Original puzzle restored.');
});

document.getElementById('btn-reset').addEventListener('click', () => {
  board = Array.from({length:N}, () => Array(N).fill(0));
  givenMask = Array.from({length:N}, () => Array(N).fill(false));
  solvedBoard = null; solutions = [];
  selectedCell = null;
  document.querySelectorAll('.cell').forEach(el => el.classList.remove('selected','related','same-num'));
  renderBoard();
  updateCandidates();
  validateConflicts();
  updateBadges();
  document.getElementById('solutions-panel').style.display = 'none';
  setStatus('Board cleared. Enter a new puzzle.');
});

/* ═══════════════════════════════════════════════
   SOLUTIONS PANEL
═══════════════════════════════════════════════ */
function renderSolutions() {
  const panel = document.getElementById('solutions-panel');
  if (solutions.length <= 1) { panel.style.display = 'none'; return; }
  panel.style.display = 'block';
  panel.innerHTML = `
    <div class="solutions-header">
      <strong>${solutions.length}${solutions.length===10?'+':''} Solutions Found</strong>
      <span>Click to load onto board</span>
    </div>
    <div class="solutions-grid" id="solutions-grid"></div>
  `;
  const sg = document.getElementById('solutions-grid');
  solutions.forEach((sol, idx) => {
    const wrap = document.createElement('div');
    wrap.className = 'mini-grid';
    wrap.innerHTML = `<div class="mini-grid-label">Solution ${idx+1}</div>`;
    const tbl = document.createElement('table');
    tbl.className = 'mini-table';
    for (let r = 0; r < N; r++) {
      const tr = document.createElement('tr');
      for (let c = 0; c < N; c++) {
        const td = document.createElement('td');
        td.textContent = sol[r][c];
        td.className = board[r][c] ? 'mg-given' : 'mg-solved';
        // box borders
        if (c === 2 || c === 5) td.style.borderRight = '1px solid #3b4572';
        if (c === 3 || c === 6) td.style.borderLeft = '1px solid #3b4572';
        if (r === 2 || r === 5) td.style.borderBottom = '1px solid #3b4572';
        if (r === 3 || r === 6) td.style.borderTop = '1px solid #3b4572';
        tr.appendChild(td);
      }
      tbl.appendChild(tr);
    }
    wrap.appendChild(tbl);
    wrap.addEventListener('click', () => {
      const merged = sol.map((row, r) => row.map((v, c) => board[r][c] ? board[r][c] : v));
      renderBoard(merged);
      updateCandidates();
      setStatus(`Loaded solution ${idx+1}.`, 'success');
    });
    sg.appendChild(wrap);
  });
}

/* ═══════════════════════════════════════════════
   FILE IMPORT
═══════════════════════════════════════════════ */
function loadGridFromArray(data) {
  board = Array.from({length:N}, () => Array(N).fill(0));
  givenMask = Array.from({length:N}, () => Array(N).fill(false));
  solutions = [];
  let filled = 0;
  for (let r = 0; r < Math.min(N, data.length); r++) {
    for (let c = 0; c < Math.min(N, data[r].length); c++) {
      const v = parseInt(data[r][c]) || 0;
      if (v >= 1 && v <= 9) { board[r][c] = v; givenMask[r][c] = true; filled++; }
    }
  }
  renderBoard();
  updateCandidates();
  validateConflicts();
  updateBadges();
  document.getElementById('solutions-panel').style.display = 'none';
  setStatus(`✓ Loaded puzzle with ${filled} given clues.`, 'success');
}

document.getElementById('file-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const ext = file.name.split('.').pop().toLowerCase();
  const reader = new FileReader();

  if (ext === 'csv') {
    reader.onload = ev => {
      const rows = ev.target.result.trim().split('\n').map(l => l.split(','));
      loadGridFromArray(rows);
    };
    reader.readAsText(file);
  } else if (ext === 'xlsx') {
    reader.onload = ev => {
      const wb = XLSX.read(ev.target.result, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const data = XLSX.utils.sheet_to_json(ws, {header:1, raw:true});
      loadGridFromArray(data);
    };
    reader.readAsArrayBuffer(file);
  } else {
    setStatus('Unsupported file type. Use .xlsx or .csv.', 'error');
  }
  e.target.value = '';
});

// Drag & drop
const ua = document.getElementById('upload-area');
ua.addEventListener('dragover', e => { e.preventDefault(); ua.style.borderColor='var(--accent)'; });
ua.addEventListener('dragleave', () => { ua.style.borderColor=''; });
ua.addEventListener('drop', e => {
  e.preventDefault(); ua.style.borderColor='';
  const file = e.dataTransfer.files[0];
  if (file) { const dt = new DataTransfer(); dt.items.add(file); document.getElementById('file-input').files = dt.files; document.getElementById('file-input').dispatchEvent(new Event('change')); }
});

/* ═══════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════ */
buildGrid();
buildNumpad();
updateCandidates();
setStatus('Click a cell, then type or tap a number. Use Solve to find all solutions.');
</script>
